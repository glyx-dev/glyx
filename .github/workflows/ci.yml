# CI — runs on every PR and push to dev/main.
#
# Deliberately targeted rather than `--workspace`:
#  - glyx-runtime links rusty_v8 (large static lib download) — cached, but the
#    first uncached run is slow. Targeted -p flags keep the tested surface to
#    the crates that have tests without building glyx-ai (Candle) etc.
#  - GPU-backend rendering is NOT exercised here (runners have no GPU);
#    TinySkia paths and all pure logic are. See docs on renderer selection.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Rust tests never open a window, but belt-and-braces for anything that probes.
  GLYX_CPU_RENDER: "1"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # `--workspace` pulls in glyx-ai/glyx-cap-audio/glyx-cap-camera/glyx-cap-hid,
      # whose deps (cpal/rodio → alsa-sys, nokhwa → v4l, hidapi → libusb) need
      # these system dev packages on Linux — same set release.yml's cap-linux
      # job already installs for the actual per-cap builds. `--workspace`
      # also pulls in glyx-cap-webview → wry → glib-sys/webkit2gtk, which
      # release.yml's cap-linux job never builds (its cap matrix excludes
      # "webview" on every platform) — so those GTK/WebKitGTK dev packages
      # are only needed here, not there.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libv4l-dev libusb-1.0-0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev
      # Zero-warnings bar (see CONTRIBUTING.md). RUSTFLAGS="-D warnings" is not
      # used because it would also deny warnings inside vendored path deps
      # (vendor/vello); instead, fail on any warning whose
      # source location is in our own crates/.
      - name: cargo check (zero warnings in crates/)
        run: |
          cargo check --workspace --message-format short 2>&1 | tee check.log
          if grep -E "^crates[/\\].*warning" check.log; then
            echo "::error::warnings found in workspace crates"; exit 1
          fi
      - name: cargo test (tested crates)
        run: cargo test -p glyx-security -p glyx-core -p glyx-runtime

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test js/packages
