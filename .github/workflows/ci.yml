# CI — runs on every PR and push to dev/main.
#
# Deliberately targeted rather than `--workspace`:
#  - glyx-runtime links rusty_v8 (large static lib download) — cached, but the
#    first uncached run is slow. Targeted -p flags keep the tested surface to
#    the crates that have tests without building glyx-ai (Candle) etc.
#  - GPU-backend rendering is NOT exercised here (runners have no GPU);
#    TinySkia paths and all pure logic are. See docs on renderer selection.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Rust tests never open a window, but belt-and-braces for anything that probes.
  GLYX_CPU_RENDER: "1"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # `--workspace` pulls in glyx-ai/glyx-cap-audio/glyx-cap-camera/glyx-cap-hid,
      # whose deps (cpal/rodio → alsa-sys, nokhwa → v4l, hidapi → libusb) need
      # these system dev packages on Linux — same set release.yml's cap-linux
      # job already installs for the actual per-cap builds. `--workspace`
      # also pulls in glyx-cap-webview → wry → glib-sys/webkit2gtk, which
      # release.yml's cap-linux job never builds (its cap matrix excludes
      # "webview" on every platform) — so those GTK/WebKitGTK dev packages
      # are only needed here, not there. Same story for libudev-dev:
      # glyx-cap-gamepad → gilrs needs it here (--workspace) AND in
      # release.yml's cap-linux job (which does build the gamepad cap).
      # glyx-tray (tray-icon → libappindicator-sys, muda → libxdo-sys) is
      # only reachable via --workspace — it's not a dependency of glyx-core/
      # glyx-runner, so release.yml never needs these two.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libv4l-dev libusb-1.0-0-dev libudev-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev
      # Zero-warnings bar (see CONTRIBUTING.md). RUSTFLAGS="-D warnings" is not
      # used because it would also deny warnings inside vendored path deps
      # (vendor/vello); instead, fail on any warning whose
      # source location is in our own crates/.
      # Two invocations, not one: `examples/calculator` defaults to the QuickJS
      # engine while every other member defaults to V8, and a single
      # `--workspace` build unifies features across members — enabling both
      # engines at once, which glyx-runtime rejects with a compile_error!
      # (they're mutually exclusive). Checking calculator on its own keeps
      # each build to exactly one engine.
      - name: cargo check (zero warnings in crates/)
        run: |
          cargo check --workspace --exclude calculator --message-format short 2>&1 | tee check.log
          cargo check -p calculator --message-format short 2>&1 | tee -a check.log
          if grep -E "^crates[/\\].*warning" check.log; then
            echo "::error::warnings found in workspace crates"; exit 1
          fi
      - name: cargo test (tested crates)
        run: cargo test -p glyx-security -p glyx-core -p glyx-runtime

  # A real app driven through the devtools protocol (GDP): the calculator
  # example (QuickJS, so no V8 download; CPU renderer, so no GPU) under a
  # virtual X display, checked by scripts/devtools/gdp-smoke.mjs and
  # tests/devtools/gdp-calculator.mjs (input, tree, waitFor, screenshots).
  devtools-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: devtools-e2e
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The second line is what every app links through glyx-core/glyx-runtime
      # (see `cargo tree -p calculator`): audio (cpal → alsa-sys), D-Bus
      # (keyring, ashpd), and glyx-tray (tray-icon/muda → gtk → glib-sys).
      - name: Install display + window-system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxrandr2 libxi6 fonts-dejavu-core
          sudo apt-get install -y libasound2-dev libdbus-1-dev libfontconfig1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: bun install --frozen-lockfile
      - name: Bundle the calculator's JS
        working-directory: examples/calculator
        run: bun build js/app.jsx --outfile js/dist/app.js --target browser --format iife --define "process.env.NODE_ENV='production'"
      - run: cargo build -p calculator
      - name: Drive the app over GDP
        run: xvfb-run -a bash tests/devtools/run-calculator.sh

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test js/packages scripts tools/glyx-devtools-ui
      - name: Versions consistent (packages, crates, internal ranges)
        run: bun scripts/release/check.mjs
