# glyx-media-build.yml
#
# Builds the glyx-media native shared library on Windows, macOS, and Linux
# using a minimal static ffmpeg build. Produces signed release artifacts.
#
# Artifacts are uploaded to GitHub Releases as:
#   glyx-media-{version}-{platform}-{arch}.{ext}
#   glyx-media-{version}-{platform}-{arch}.manifest.json
#   glyx-media-{version}-{platform}-{arch}.manifest.sig
#
# Triggered on version tags (v1.0.0) or manually via workflow_dispatch.

name: Build glyx-media DLL

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  # ── Resolve version once, shared by every job ────────────────────────────────
  # Tag pushes derive the version from the tag itself (v0.1.0 -> 0.1.0) instead
  # of a hardcoded fallback, so artifact names always match what was actually
  # tagged. workflow_dispatch keeps its manual input for ad-hoc rebuilds.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      - name: Resolve GLYX_MEDIA_VERSION
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

  # ── Windows x64 ──────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    env:
      GLYX_MEDIA_VERSION: ${{ needs.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg build deps (vcpkg)
        run: |
          # Use pre-built static ffmpeg from BtbN's GitHub releases
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist
          $dir = Get-ChildItem ffmpeg-dist | Select-Object -First 1 -ExpandProperty FullName
          echo "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV

      # Locates cl.exe/link.exe via vswhere regardless of which VS edition
      # (Community/Professional/Enterprise) the runner image actually has —
      # the previous hardcoded "...Enterprise\VC\Auxiliary\Build\vcvars64.bat"
      # path assumed an edition that isn't guaranteed to match the image.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build glyx-media.dll (MSVC)
        shell: cmd
        run: |
          cl /LD /O2 /I "%FFMPEG_DIR%\include" ^
            glyx-media-c\glyx_media.c ^
            /Fe:glyx-media-%GLYX_MEDIA_VERSION%-windows-x64.dll ^
            /link /LIBPATH:"%FFMPEG_DIR%\lib" ^
            avformat.lib avcodec.lib avfilter.lib swscale.lib swresample.lib avutil.lib

      - name: Generate manifest + sign
        env:
          GLYX_MEDIA_SIGN_KEY: ${{ secrets.GLYX_MEDIA_SIGN_KEY }}
        run: |
          python3 .github/scripts/sign_manifest.py `
            glyx-media-$env:GLYX_MEDIA_VERSION-windows-x64.dll `
            windows x64 $env:GLYX_MEDIA_VERSION

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glyx-media-windows-x64
          path: |
            glyx-media-${{ env.GLYX_MEDIA_VERSION }}-windows-x64.dll
            glyx-media-${{ env.GLYX_MEDIA_VERSION }}-windows-x64.manifest.json
            glyx-media-${{ env.GLYX_MEDIA_VERSION }}-windows-x64.manifest.sig

  # ── macOS x64 + arm64 ────────────────────────────────────────────────────────
  build-macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    env:
      GLYX_MEDIA_VERSION: ${{ needs.version.outputs.value }}
    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            target: x86_64-apple-macosx13.0
          - arch: arm64
            target: arm64-apple-macosx13.0

    steps:
      - uses: actions/checkout@v4

      # macos-latest runners are Apple Silicon — /opt/homebrew's ffmpeg is
      # arm64-only, so the x64 (Intel) leg needs its own x86_64 Homebrew
      # under Rosetta at /usr/local instead. The arm64 leg uses the native
      # /opt/homebrew install as before.
      - name: Install ffmpeg (Homebrew, arm64)
        if: matrix.arch == 'arm64'
        run: brew install ffmpeg pkg-config

      - name: Install ffmpeg (Rosetta Homebrew, x64)
        if: matrix.arch == 'x64'
        run: |
          softwareupdate --install-rosetta --agree-to-license
          if [ ! -x /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          arch -x86_64 /usr/local/bin/brew install ffmpeg pkg-config

      - name: Build glyx-media.dylib
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            export PKG_CONFIG_PATH="/usr/local/opt/ffmpeg/lib/pkgconfig:/usr/local/lib/pkgconfig"
            PKG_CONFIG=/usr/local/bin/pkg-config
          else
            PKG_CONFIG=pkg-config
          fi
          FFMPEG_CFLAGS=$($PKG_CONFIG --cflags libavformat libavcodec libswscale libswresample libavutil)
          FFMPEG_LIBS=$($PKG_CONFIG --libs libavformat libavcodec libswscale libswresample libavutil)
          clang -arch ${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }} \
            -shared -fPIC -O2 \
            $FFMPEG_CFLAGS \
            glyx-media-c/glyx_media.c \
            $FFMPEG_LIBS \
            -o glyx-media-${GLYX_MEDIA_VERSION}-macos-${{ matrix.arch }}.dylib

      - name: Generate manifest + sign
        env:
          GLYX_MEDIA_SIGN_KEY: ${{ secrets.GLYX_MEDIA_SIGN_KEY }}
        run: |
          python3 .github/scripts/sign_manifest.py \
            glyx-media-${GLYX_MEDIA_VERSION}-macos-${{ matrix.arch }}.dylib \
            macos ${{ matrix.arch }} ${GLYX_MEDIA_VERSION}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glyx-media-macos-${{ matrix.arch }}
          path: |
            glyx-media-${{ env.GLYX_MEDIA_VERSION }}-macos-${{ matrix.arch }}.dylib
            glyx-media-${{ env.GLYX_MEDIA_VERSION }}-macos-${{ matrix.arch }}.manifest.json
            glyx-media-${{ env.GLYX_MEDIA_VERSION }}-macos-${{ matrix.arch }}.manifest.sig

  # ── Linux x64 ────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux x64
    needs: version
    runs-on: ubuntu-latest
    env:
      GLYX_MEDIA_VERSION: ${{ needs.version.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev \
            libswscale-dev libswresample-dev libavutil-dev pkg-config

      - name: Build glyx-media.so
        run: |
          FFMPEG_CFLAGS=$(pkg-config --cflags libavformat libavcodec libswscale libswresample libavutil)
          FFMPEG_LIBS=$(pkg-config --libs libavformat libavcodec libswscale libswresample libavutil)
          gcc -shared -fPIC -O2 \
            $FFMPEG_CFLAGS \
            glyx-media-c/glyx_media.c \
            $FFMPEG_LIBS \
            -lpthread -lm -lz \
            -o glyx-media-${GLYX_MEDIA_VERSION}-linux-x64.so

      - name: Generate manifest + sign
        env:
          GLYX_MEDIA_SIGN_KEY: ${{ secrets.GLYX_MEDIA_SIGN_KEY }}
        run: |
          python3 .github/scripts/sign_manifest.py \
            glyx-media-${GLYX_MEDIA_VERSION}-linux-x64.so \
            linux x64 ${GLYX_MEDIA_VERSION}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glyx-media-linux-x64
          path: |
            glyx-media-${{ env.GLYX_MEDIA_VERSION }}-linux-x64.so
            glyx-media-${{ env.GLYX_MEDIA_VERSION }}-linux-x64.manifest.json
            glyx-media-${{ env.GLYX_MEDIA_VERSION }}-linux-x64.manifest.sig

  # ── Publish to GitHub Release ────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [version, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            glyx-media-*.dll
            glyx-media-*.dylib
            glyx-media-*.so
            glyx-media-*.manifest.json
            glyx-media-*.manifest.sig
          body: |
            glyx-media DLL release — ffmpeg-backed media codec for Glyx apps.

            Download the DLL for your platform and cache it at:
            `~/.glyx/cache/media/glyx-media-{version}-{platform}-{arch}.{ext}`
