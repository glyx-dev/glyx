name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn

jobs:
  # ── Version guard ──────────────────────────────────────────────────────────
  # Every build job waits on this: the tag must equal the version of every
  # crate and npm package (bun run release:version sets them together), or
  # nothing is built or published.
  versions:
    name: Versions match the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/release/check.mjs "${{ github.ref_name }}"

  # ── Lean glyx-runner binary ────────────────────────────────────────────────
  # One runner artifact pair (lean prod + dev) per (platform, engine) —
  # engine selection lives in glyx.config's "engine" field (default "v8");
  # glyx-cli's find_or_build_runner/download_runner pick the matching
  # artifact by name (v8 keeps the original unprefixed names; quickjs gets
  # a "quickjs-" segment — see crates/glyx-cli/src/main.rs).
  runner:
    name: Runner (${{ matrix.platform.target }}, ${{ matrix.engine }})
    needs: versions
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        engine: [v8, quickjs]
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_suffix: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_suffix: ""
          # Intel Macs: a native Intel runner (macos-13 is retired; macos-15-intel is
          # available until August 2027, after which this leg moves to a cross build).
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin_suffix: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_suffix: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}-runner-${{ matrix.engine }}

      - name: Install system deps (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libv4l-dev libusb-1.0-0-dev libudev-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev

      - name: Compute artifact names
        id: names
        shell: bash
        run: |
          if [ "${{ matrix.engine }}" = "quickjs" ]; then
            echo "lean=glyx-runner-quickjs-${{ matrix.platform.target }}${{ matrix.platform.bin_suffix }}" >> "$GITHUB_OUTPUT"
            echo "dev=glyx-runner-quickjs-dev-${{ matrix.platform.target }}${{ matrix.platform.bin_suffix }}" >> "$GITHUB_OUTPUT"
          else
            echo "lean=glyx-runner-${{ matrix.platform.target }}${{ matrix.platform.bin_suffix }}" >> "$GITHUB_OUTPUT"
            echo "dev=glyx-runner-dev-${{ matrix.platform.target }}${{ matrix.platform.bin_suffix }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build lean runner
        # --no-default-features drops "dev"; the engine feature must be
        # re-added explicitly or glyx-core::run() fails to compile (its `rt`
        # local is cfg-gated on the v8/quickjs engine feature, not linked by
        # default once neither is implied).
        run: cargo build --release --no-default-features --features ${{ matrix.engine }} -p glyx-runner --target ${{ matrix.platform.target }}

      - name: Stage lean artifact
        shell: bash
        run: |
          cp "target/${{ matrix.platform.target }}/release/glyx-runner${{ matrix.platform.bin_suffix }}" \
             "${{ steps.names.outputs.lean }}"

      # The dev-flavored runner (hot-reload + overlay) — downloaded by the CLI
      # for `glyx dev` on machines without the source workspace.
      - name: Build dev runner
        run: cargo build --release --no-default-features --features dev,${{ matrix.engine }} -p glyx-runner --target ${{ matrix.platform.target }}

      - name: Stage dev artifact
        shell: bash
        run: |
          cp "target/${{ matrix.platform.target }}/release/glyx-runner${{ matrix.platform.bin_suffix }}" \
             "${{ steps.names.outputs.dev }}"

      - uses: actions/upload-artifact@v4
        with:
          name: runner-${{ matrix.platform.target }}-${{ matrix.engine }}
          path: |
            ${{ steps.names.outputs.lean }}
            ${{ steps.names.outputs.dev }}

  # ── glyx CLI binary ────────────────────────────────────────────────────────
  cli:
    name: CLI (${{ matrix.target }})
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_suffix: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_suffix: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin_suffix: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_suffix: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-cli

      # The CLI embeds the DevTools UI (`glyx inspect`) at compile time
      # (crates/glyx-cli/build.rs); without this step it would ship only a
      # "not built" placeholder page.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build the DevTools UI
        shell: bash
        run: bun install --frozen-lockfile && (cd tools/glyx-devtools-ui && bun run build)

      - name: Build CLI
        run: cargo build --release -p glyx-cli --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/glyx${{ matrix.bin_suffix }}" \
             "glyx-${{ matrix.target }}${{ matrix.bin_suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: glyx-${{ matrix.target }}${{ matrix.bin_suffix }}

  # ── Base V8 snapshot ───────────────────────────────────────────────────────
  # `glyx build --mode snapshot` needs a V8 snapshot, and making one needs the Rust workspace.
  # The snapshot holds only the runtime's stub bindings (the app is evaluated at runtime), so it is
  # the same for every app: build it once per platform here, sign it with the capability key, and
  # let the CLI download and verify it (crates/glyx-cli/src/snapshot_blob.rs). A snapshot only
  # loads in the exact V8 build that made it, so it is made from this tag's source, on the same
  # kind of runner as the runner binary of the same platform.
  snapshot:
    name: V8 snapshot (${{ matrix.target }})
    needs: versions
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-snapshot
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libv4l-dev libusb-1.0-0-dev libudev-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev
      - name: Build glyx-snapshot
        run: cargo build --release -p glyx-snapshot
      - name: Create the base snapshot
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="glyx-snapshot-${VERSION}-${{ matrix.target }}.snapshot"
          BIN=target/release/glyx-snapshot
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --base "$ASSET"
          test -s "$ASSET" || { echo "empty snapshot"; exit 1; }
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          ls -l "$ASSET"
      - name: Sign
        shell: bash
        env:
          CAP_SIGNING_KEY: ${{ secrets.CAP_SIGNING_KEY }}
        run: |
          echo "$CAP_SIGNING_KEY" > cap-key.pem
          openssl pkeyutl -sign -rawin -inkey cap-key.pem -in "$ASSET" -out "$ASSET.sig"
          rm -f cap-key.pem
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sig

  # ── ICU data ───────────────────────────────────────────────────────────────
  # The V8 runners are built without embedded ICU data, so `Intl` and `toLocaleString()` need an
  # `icudtl.dat`. `glyx dev` / `glyx build` / `glyx package` trim one to the app's locales; in the source
  # checkout they start from crates/glyx-runtime/icudtl.dat, and everywhere else from this asset, which
  # the CLI downloads and verifies (crates/glyx-cli/src/icu_trim.rs). It is loaded straight into V8, so
  # like the snapshot and the capability modules it is signed with the capability key. The data is the
  # same on every platform (all targets are little-endian), so one asset serves all.
  icu:
    name: ICU data
    needs: versions
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Stage and sign
        env:
          CAP_SIGNING_KEY: ${{ secrets.CAP_SIGNING_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="glyx-icudtl-${VERSION}.dat"
          cp crates/glyx-runtime/icudtl.dat "$ASSET"
          test -s "$ASSET" || { echo "empty ICU data"; exit 1; }
          echo "$CAP_SIGNING_KEY" > cap-key.pem
          openssl pkeyutl -sign -rawin -inkey cap-key.pem -in "$ASSET" -out "$ASSET.sig"
          rm -f cap-key.pem
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          ls -l "$ASSET" "$ASSET.sig"
      - uses: actions/upload-artifact@v4
        with:
          name: icu-data
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sig

  # ── Capability DLLs ────────────────────────────────────────────────────────
  cap-windows:
    name: Cap DLLs (windows)
    needs: versions
    runs-on: windows-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        cap: [audio, camera, gamepad, hid, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-cap-${{ matrix.cap }}
      - name: Build
        run: cargo build --release -p glyx-cap-${{ matrix.cap }}
      - name: Stage
        shell: bash
        run: cp "target/release/glyx_cap_${{ matrix.cap }}.dll" "glyx_cap_${{ matrix.cap }}-windows.dll"
      - name: Sign
        shell: bash
        env:
          CAP_SIGNING_KEY: ${{ secrets.CAP_SIGNING_KEY }}
        run: |
          echo "$CAP_SIGNING_KEY" > cap-key.pem
          openssl pkeyutl -sign -rawin -inkey cap-key.pem \
            -in "glyx_cap_${{ matrix.cap }}-windows.dll" \
            -out "glyx_cap_${{ matrix.cap }}-windows.dll.sig"
          rm -f cap-key.pem
      - uses: actions/upload-artifact@v4
        with:
          name: cap-${{ matrix.cap }}-windows
          path: |
            glyx_cap_${{ matrix.cap }}-windows.dll
            glyx_cap_${{ matrix.cap }}-windows.dll.sig

  cap-macos:
    name: Cap DLLs (macos ${{ matrix.arch }})
    needs: versions
    # Apple silicon keeps the original asset names (glyx_cap_<cap>-macos.dylib); Intel adds a
    # "-x64" suffix (glyx_cap_<cap>-macos-x64.dylib). See cap_release_asset in glyx-cli.
    runs-on: ${{ matrix.arch == 'x64' && 'macos-15-intel' || 'macos-latest' }}
    environment: release
    env:
      PLATFORM: ${{ matrix.arch == 'x64' && 'macos-x64' || 'macos' }}
    strategy:
      fail-fast: false
      matrix:
        cap: [audio, camera, gamepad, hid, ai]
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}-cap-${{ matrix.cap }}
      - name: Build
        run: cargo build --release -p glyx-cap-${{ matrix.cap }}
      - name: Stage
        run: cp "target/release/libglyx_cap_${{ matrix.cap }}.dylib" "glyx_cap_${{ matrix.cap }}-${PLATFORM}.dylib"
      - name: Sign
        env:
          CAP_SIGNING_KEY: ${{ secrets.CAP_SIGNING_KEY }}
        run: |
          echo "$CAP_SIGNING_KEY" > cap-key.pem
          openssl pkeyutl -sign -rawin -inkey cap-key.pem \
            -in "glyx_cap_${{ matrix.cap }}-${PLATFORM}.dylib" \
            -out "glyx_cap_${{ matrix.cap }}-${PLATFORM}.dylib.sig"
          rm -f cap-key.pem
      - uses: actions/upload-artifact@v4
        with:
          name: cap-${{ matrix.cap }}-${{ env.PLATFORM }}
          path: |
            glyx_cap_${{ matrix.cap }}-${{ env.PLATFORM }}.dylib
            glyx_cap_${{ matrix.cap }}-${{ env.PLATFORM }}.dylib.sig

  cap-linux:
    name: Cap DLLs (linux)
    needs: versions
    runs-on: ubuntu-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        cap: [audio, camera, gamepad, hid, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-cap-${{ matrix.cap }}
      # libudev-dev is only actually needed for the "gamepad" cap (gilrs), but
      # installed unconditionally here since apt is cheap and this matrix
      # runs one job per cap anyway — simpler than a per-cap conditional.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libv4l-dev libusb-1.0-0-dev libudev-dev libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libdbus-1-dev
      - name: Build
        run: cargo build --release -p glyx-cap-${{ matrix.cap }}
      - name: Stage
        run: cp "target/release/libglyx_cap_${{ matrix.cap }}.so" "glyx_cap_${{ matrix.cap }}-linux.so"
      - name: Sign
        env:
          CAP_SIGNING_KEY: ${{ secrets.CAP_SIGNING_KEY }}
        run: |
          echo "$CAP_SIGNING_KEY" > cap-key.pem
          openssl pkeyutl -sign -rawin -inkey cap-key.pem \
            -in "glyx_cap_${{ matrix.cap }}-linux.so" \
            -out "glyx_cap_${{ matrix.cap }}-linux.so.sig"
          rm -f cap-key.pem
      - uses: actions/upload-artifact@v4
        with:
          name: cap-${{ matrix.cap }}-linux
          path: |
            glyx_cap_${{ matrix.cap }}-linux.so
            glyx_cap_${{ matrix.cap }}-linux.so.sig

  # ── Publish GitHub Release ─────────────────────────────────────────────────
  publish:
    name: Publish release
    needs: [versions, runner, cli, snapshot, icu, cap-windows, cap-macos, cap-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Glyx ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*
            scripts/install.sh
            scripts/install.ps1
