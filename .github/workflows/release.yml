name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn

jobs:
  # ── Lean glyx-runner binary ────────────────────────────────────────────────
  # One runner artifact pair (lean prod + dev) per (platform, engine) —
  # engine selection lives in glyx.config's "engine" field (default "v8");
  # glyx-cli's find_or_build_runner/download_runner pick the matching
  # artifact by name (v8 keeps the original unprefixed names; quickjs gets
  # a "quickjs-" segment — see crates/glyx-cli/src/main.rs).
  runner:
    name: Runner (${{ matrix.platform.target }}, ${{ matrix.engine }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        engine: [v8, quickjs]
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_suffix: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_suffix: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_suffix: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}-runner-${{ matrix.engine }}

      - name: Install system deps (Linux)
        if: matrix.platform.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libv4l-dev libusb-1.0-0-dev

      - name: Compute artifact names
        id: names
        shell: bash
        run: |
          if [ "${{ matrix.engine }}" = "quickjs" ]; then
            echo "lean=glyx-runner-quickjs-${{ matrix.platform.target }}${{ matrix.platform.bin_suffix }}" >> "$GITHUB_OUTPUT"
            echo "dev=glyx-runner-quickjs-dev-${{ matrix.platform.target }}${{ matrix.platform.bin_suffix }}" >> "$GITHUB_OUTPUT"
          else
            echo "lean=glyx-runner-${{ matrix.platform.target }}${{ matrix.platform.bin_suffix }}" >> "$GITHUB_OUTPUT"
            echo "dev=glyx-runner-dev-${{ matrix.platform.target }}${{ matrix.platform.bin_suffix }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build lean runner
        # --no-default-features drops "dev"; the engine feature must be
        # re-added explicitly or glyx-core::run() fails to compile (its `rt`
        # local is cfg-gated on the v8/quickjs engine feature, not linked by
        # default once neither is implied).
        run: cargo build --release --no-default-features --features ${{ matrix.engine }} -p glyx-runner --target ${{ matrix.platform.target }}

      - name: Stage lean artifact
        shell: bash
        run: |
          cp "target/${{ matrix.platform.target }}/release/glyx-runner${{ matrix.platform.bin_suffix }}" \
             "${{ steps.names.outputs.lean }}"

      # The dev-flavored runner (hot-reload + overlay) — downloaded by the CLI
      # for `glyx dev` on machines without the source workspace.
      - name: Build dev runner
        run: cargo build --release --no-default-features --features dev,${{ matrix.engine }} -p glyx-runner --target ${{ matrix.platform.target }}

      - name: Stage dev artifact
        shell: bash
        run: |
          cp "target/${{ matrix.platform.target }}/release/glyx-runner${{ matrix.platform.bin_suffix }}" \
             "${{ steps.names.outputs.dev }}"

      - uses: actions/upload-artifact@v4
        with:
          name: runner-${{ matrix.platform.target }}-${{ matrix.engine }}
          path: |
            ${{ steps.names.outputs.lean }}
            ${{ steps.names.outputs.dev }}

  # ── glyx CLI binary ────────────────────────────────────────────────────────
  cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_suffix: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_suffix: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_suffix: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-cli

      - name: Build CLI
        run: cargo build --release -p glyx-cli --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/glyx${{ matrix.bin_suffix }}" \
             "glyx-${{ matrix.target }}${{ matrix.bin_suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: glyx-${{ matrix.target }}${{ matrix.bin_suffix }}

  # ── Capability DLLs ────────────────────────────────────────────────────────
  cap-windows:
    name: Cap DLLs (windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cap: [audio, camera, gamepad, hid, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-cap-${{ matrix.cap }}
      - name: Build
        run: cargo build --release -p glyx-cap-${{ matrix.cap }}
      - name: Stage
        shell: bash
        run: cp "target/release/glyx_cap_${{ matrix.cap }}.dll" "glyx_cap_${{ matrix.cap }}-windows.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: cap-${{ matrix.cap }}-windows
          path: glyx_cap_${{ matrix.cap }}-windows.dll

  cap-macos:
    name: Cap DLLs (macos)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        cap: [audio, camera, gamepad, hid, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-cap-${{ matrix.cap }}
      - name: Build
        run: cargo build --release -p glyx-cap-${{ matrix.cap }}
      - name: Stage
        run: cp "target/release/libglyx_cap_${{ matrix.cap }}.dylib" "glyx_cap_${{ matrix.cap }}-macos.dylib"
      - uses: actions/upload-artifact@v4
        with:
          name: cap-${{ matrix.cap }}-macos
          path: glyx_cap_${{ matrix.cap }}-macos.dylib

  cap-linux:
    name: Cap DLLs (linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cap: [audio, camera, gamepad, hid, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-cap-${{ matrix.cap }}
      # libudev-dev is only actually needed for the "gamepad" cap (gilrs), but
      # installed unconditionally here since apt is cheap and this matrix
      # runs one job per cap anyway — simpler than a per-cap conditional.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libv4l-dev libusb-1.0-0-dev libudev-dev
      - name: Build
        run: cargo build --release -p glyx-cap-${{ matrix.cap }}
      - name: Stage
        run: cp "target/release/libglyx_cap_${{ matrix.cap }}.so" "glyx_cap_${{ matrix.cap }}-linux.so"
      - uses: actions/upload-artifact@v4
        with:
          name: cap-${{ matrix.cap }}-linux
          path: glyx_cap_${{ matrix.cap }}-linux.so

  # ── Publish GitHub Release ─────────────────────────────────────────────────
  publish:
    name: Publish release
    needs: [runner, cli, cap-windows, cap-macos, cap-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Glyx ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*
            scripts/install.sh
            scripts/install.ps1
