# velox-media-build.yml
#
# Builds the velox-media native shared library on Windows, macOS, and Linux
# using a minimal static ffmpeg build. Produces signed release artifacts.
#
# Artifacts are uploaded to GitHub Releases as:
#   velox-media-{version}-{platform}-{arch}.{ext}
#   velox-media-{version}-{platform}-{arch}.manifest.json
#   velox-media-{version}-{platform}-{arch}.manifest.sig
#
# Triggered on version tags (v1.0.0) or manually via workflow_dispatch.

name: Build velox-media DLL

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

env:
  VELOX_MEDIA_VERSION: ${{ github.event.inputs.version || '1.0.0' }}

jobs:
  # ── Windows x64 ──────────────────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg build deps (vcpkg)
        run: |
          # Use pre-built static ffmpeg from BtbN's GitHub releases
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist
          $dir = Get-ChildItem ffmpeg-dist | Select-Object -First 1 -ExpandProperty FullName
          echo "FFMPEG_DIR=$dir" >> $env:GITHUB_ENV

      - name: Build velox-media.dll (MSVC)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /LD /O2 /I "%FFMPEG_DIR%\include" ^
            velox-media-c\velox_media.c ^
            /Fe:velox-media-%VELOX_MEDIA_VERSION%-windows-x64.dll ^
            /link /LIBPATH:"%FFMPEG_DIR%\lib" ^
            avformat.lib avcodec.lib avfilter.lib swscale.lib swresample.lib avutil.lib

      - name: Generate manifest + sign
        env:
          VELOX_MEDIA_SIGN_KEY: ${{ secrets.VELOX_MEDIA_SIGN_KEY }}
        run: |
          python3 .github/scripts/sign_manifest.py `
            velox-media-$env:VELOX_MEDIA_VERSION-windows-x64.dll `
            windows x64 $env:VELOX_MEDIA_VERSION

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velox-media-windows-x64
          path: |
            velox-media-${{ env.VELOX_MEDIA_VERSION }}-windows-x64.dll
            velox-media-${{ env.VELOX_MEDIA_VERSION }}-windows-x64.manifest.json
            velox-media-${{ env.VELOX_MEDIA_VERSION }}-windows-x64.manifest.sig

  # ── macOS x64 + arm64 ────────────────────────────────────────────────────────
  build-macos:
    name: macOS
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            target: x86_64-apple-macosx13.0
          - arch: arm64
            target: arm64-apple-macosx13.0

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (Homebrew)
        run: brew install ffmpeg pkg-config

      - name: Build velox-media.dylib
        run: |
          FFMPEG_CFLAGS=$(pkg-config --cflags libavformat libavcodec libswscale libswresample libavutil)
          FFMPEG_LIBS=$(pkg-config --libs libavformat libavcodec libswscale libswresample libavutil)
          clang -arch ${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }} \
            -shared -fPIC -O2 \
            $FFMPEG_CFLAGS \
            velox-media-c/velox_media.c \
            $FFMPEG_LIBS \
            -o velox-media-${VELOX_MEDIA_VERSION}-macos-${{ matrix.arch }}.dylib

      - name: Generate manifest + sign
        env:
          VELOX_MEDIA_SIGN_KEY: ${{ secrets.VELOX_MEDIA_SIGN_KEY }}
        run: |
          python3 .github/scripts/sign_manifest.py \
            velox-media-${VELOX_MEDIA_VERSION}-macos-${{ matrix.arch }}.dylib \
            macos ${{ matrix.arch }} ${VELOX_MEDIA_VERSION}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velox-media-macos-${{ matrix.arch }}
          path: |
            velox-media-${{ env.VELOX_MEDIA_VERSION }}-macos-${{ matrix.arch }}.dylib
            velox-media-${{ env.VELOX_MEDIA_VERSION }}-macos-${{ matrix.arch }}.manifest.json
            velox-media-${{ env.VELOX_MEDIA_VERSION }}-macos-${{ matrix.arch }}.manifest.sig

  # ── Linux x64 ────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev \
            libswscale-dev libswresample-dev libavutil-dev pkg-config

      - name: Build velox-media.so
        run: |
          FFMPEG_CFLAGS=$(pkg-config --cflags libavformat libavcodec libswscale libswresample libavutil)
          FFMPEG_LIBS=$(pkg-config --libs libavformat libavcodec libswscale libswresample libavutil)
          gcc -shared -fPIC -O2 \
            $FFMPEG_CFLAGS \
            velox-media-c/velox_media.c \
            $FFMPEG_LIBS \
            -lpthread -lm -lz \
            -o velox-media-${VELOX_MEDIA_VERSION}-linux-x64.so

      - name: Generate manifest + sign
        env:
          VELOX_MEDIA_SIGN_KEY: ${{ secrets.VELOX_MEDIA_SIGN_KEY }}
        run: |
          python3 .github/scripts/sign_manifest.py \
            velox-media-${VELOX_MEDIA_VERSION}-linux-x64.so \
            linux x64 ${VELOX_MEDIA_VERSION}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velox-media-linux-x64
          path: |
            velox-media-${{ env.VELOX_MEDIA_VERSION }}-linux-x64.so
            velox-media-${{ env.VELOX_MEDIA_VERSION }}-linux-x64.manifest.json
            velox-media-${{ env.VELOX_MEDIA_VERSION }}-linux-x64.manifest.sig

  # ── Publish to GitHub Release ────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            velox-media-*.dll
            velox-media-*.dylib
            velox-media-*.so
            velox-media-*.manifest.json
            velox-media-*.manifest.sig
          body: |
            velox-media DLL release — ffmpeg-backed media codec for Velox apps.

            Download the DLL for your platform and cache it at:
            `~/.velox/cache/media/velox-media-{version}-{platform}-{arch}.{ext}`
