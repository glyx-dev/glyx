[workspace]
resolver = "2"
members = [
    "crates/velox-core",
    "crates/velox-shell",
    "crates/velox-gpu",
    "crates/velox-renderer",
    "crates/velox-text",
    "crates/velox-layout",
    "crates/velox-runtime",
    "crates/velox-security",
    "crates/velox-db",
    "crates/velox-3d",
    "crates/velox-ai",
    "crates/velox-sysapi",
    "crates/velox-perf",
    "crates/velox-cli",
    "crates/velox-runner",
    "examples/hello-world",
    "examples/hello-world-snapshot",
    "examples/cli-test",
    "examples/notes-app",
    "examples/calculator",
    "crates/velox-snapshot",
    "crates/velox-media",
]

[workspace.dependencies]
# Windowing + GPU
winit     = "0.30"
wgpu      = "22"

# 2D Rendering
vello     = "0.3"
peniko    = "0.2"
kurbo     = "0.11"

# Text
parley    = "0.2"

# Layout
taffy     = "0.5"

# JS Runtime
v8        = { package = "rusty_v8", version = "0.32" }

# Async
tokio     = { version = "1", features = ["rt-multi-thread", "fs", "sync", "time"] }

# Serialisation
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# CLI
clap      = { version = "4", features = ["derive"] }

# Utils
log        = "0.4"
env_logger = "0.11"
crc32fast  = "1"
dotenvy   = "0.15"
thiserror = "1"
anyhow    = "1"
pollster  = "0.3"
bytemuck  = { version = "1", features = ["derive"] }
smallvec  = "1"
image     = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
notify    = "6.1"
sqlx            = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
libsqlite3-sys  = { version = "0.30", features = ["bundled"] }
rfd                 = { version = "0.14", features = ["tokio"] }
arboard             = "3"
keyring             = "3"
clipboard-win       = "5"
notify-rust         = "4"
raw-window-handle   = "0.6"
reqwest             = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
base64              = "0.22"
tokio-tungstenite   = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util        = "0.3"
mdns-sd             = "0.11"
battery             = "0.7"
sysinfo             = "0.33"
keepawake           = "0.5"
gilrs               = "0.11"
global-hotkey       = "0.6"
lru                 = "0.12"
dark-light          = "1"
rodio               = { version = "0.17", features = ["symphonia-all"] }
glam                = "0.28"
gltf                = { version = "1" }
nokhwa              = { version = "0.10", features = ["input-native", "output-threaded"] }
ffmpeg-sidecar      = "2"
hidapi              = "2"
self_update         = { version = "0.41", default-features = false, features = ["archive-zip", "archive-tar", "compression-flate2", "compression-zip-deflate"] }
ico                 = "0.3"
zip                 = { version = "2", default-features = false, features = ["deflate"] }
flate2              = "1"
tar                 = "0.4"
libloading          = "0.8"
sha2                = "0.10"
ed25519-dalek       = { version = "2", default-features = false, features = ["std"] }
cpal                = "0.15"
hound               = "3"

# AI / ML — Candle (Hugging Face minimalist ML framework, CPU-only by default)
candle-core         = { version = "0.8", default-features = false }
candle-nn           = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false }
hf-hub              = "0.3"
tokenizers          = "0.19"

[profile.dev]
opt-level = 1          # faster compiles, decent perf in dev

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"      # remove debug symbols from binary (~50% size reduction)
panic = "abort"        # no unwinding machinery; smaller binary, lower working set
