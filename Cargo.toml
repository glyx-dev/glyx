[workspace]
resolver = "2"
members = [
    "crates/glyx-core",
    "crates/glyx-shell",
    "crates/glyx-gpu",
    "crates/glyx-renderer",
    "crates/glyx-text",
    "crates/glyx-layout",
    "crates/glyx-runtime",
    "crates/glyx-security",
    "crates/glyx-db",
    "crates/glyx-3d",
    "crates/glyx-ai",
    "crates/glyx-sysapi",
    "crates/glyx-perf",
    "crates/glyx-cli",
    "crates/glyx-runner",
    "examples/hello-world",
    "examples/notes-app",
    "examples/calculator",
    "examples/files",
    "examples/model-viewer",
    "crates/glyx-snapshot",
    "crates/glyx-media",
    "crates/glyx-cap-abi",
    "crates/glyx-cap-audio",
    "crates/glyx-cap-ai",
    "crates/glyx-cap-gamepad",
    "crates/glyx-cap-hid",
    "crates/glyx-cap-camera",
    "crates/glyx-macros",
    "crates/glyx-verify",
    "crates/glyx-tray",
    # "crates/glyx-webview",  # TODO: not yet scaffolded
]

[workspace.dependencies]
# Windowing + GPU
winit     = "0.30"
wgpu      = { version = "29", features = ["counters"] }

# 2D Rendering
vello     = "0.9"
peniko    = "0.6"
kurbo     = "0.11"

# Text
parley    = "0.10"

# Layout
taffy     = "0.10"

# JS Runtime
v8        = "150"

# Async
tokio     = { version = "1", features = ["rt-multi-thread", "fs", "sync", "time"] }

# Serialisation
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap      = { version = "4", features = ["derive"] }

# Utils
log        = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crc32fast  = "1"
dotenvy   = "0.15"
thiserror = "1"
anyhow    = "1"
pollster  = "0.3"
bytemuck  = { version = "1", features = ["derive"] }
smallvec  = "1"
image     = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
notify    = "6.1"
sqlx            = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
libsqlite3-sys  = { version = "0.30", features = ["bundled"] }
rfd                 = { version = "0.14", features = ["tokio"] }
arboard             = "3"
keyring             = "3"
clipboard-win       = "5"
notify-rust         = "4"
raw-window-handle   = "0.6"
reqwest             = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
base64              = "0.22"
tokio-tungstenite   = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util        = "0.3"
mdns-sd             = "0.11"
battery             = "0.7"
sysinfo             = "0.33"
keepawake           = "0.5"
gilrs               = "0.11"
global-hotkey       = "0.6"
lru                 = "0.12"
mimalloc            = "0.1"
dark-light          = "1"
tiny-skia           = "0.11"
swash               = "0.1"
rodio               = { version = "0.17", features = ["symphonia-all"] }
glam                = "0.28"
gltf                = { version = "1" }
nokhwa              = { version = "0.10", features = ["input-native", "output-threaded"] }
ffmpeg-sidecar      = "2"
hidapi              = "2"
self_update         = { version = "0.41", default-features = false, features = ["archive-zip", "archive-tar", "compression-flate2", "compression-zip-deflate"] }
ico                 = "0.3"
zip                 = { version = "2", default-features = false, features = ["deflate"] }
flate2              = "1"
tar                 = "0.4"
libloading          = "0.8"
proc-macro2         = "1"
quote               = "1"
syn                 = { version = "2", features = ["full"] }
sha2                = "0.10"
ed25519-dalek       = { version = "2", default-features = false, features = ["std", "pkcs8"] }
cpal                = "0.15"
hound               = "3"
hex                 = "0.4"
windows-sys         = { version = "0.59", features = [] }

# System tray
tray-icon           = "0.24"
muda                = "0.19"

# WebView (wry wraps the OS web engine: WebView2 / WKWebView / WebKitGTK)
wry                 = "0.50"

# AI / ML — Candle (Hugging Face minimalist ML framework, CPU-only by default)
candle-core         = { version = "0.8", default-features = false }
candle-nn           = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false }
hf-hub              = "0.3"
tokenizers          = "0.19"

[profile.dev]
opt-level = 1          # faster compiles, decent perf in dev

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"      # remove debug symbols from binary (~50% size reduction)
panic = "abort"        # no unwinding machinery; smaller binary, lower working set

[patch.crates-io]
vello            = { path = "vendor/vello" }
libmimalloc-sys  = { path = "vendor/libmimalloc-sys" }
