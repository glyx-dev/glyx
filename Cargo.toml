[workspace]
resolver = "2"
members = [
    "crates/velox-core",
    "crates/velox-shell",
    "crates/velox-gpu",
    "crates/velox-renderer",
    "crates/velox-text",
    "crates/velox-layout",
    "crates/velox-runtime",
    "crates/velox-security",
    "crates/velox-db",
    "crates/velox-3d",
    "crates/velox-ai",
    "crates/velox-sysapi",
    "crates/velox-perf",
    "crates/velox-cli",
    "examples/hello-world",
]

[workspace.dependencies]
# Windowing + GPU
winit     = "0.30"
wgpu      = "22"

# 2D Rendering
vello     = "0.3"
peniko    = "0.2"
kurbo     = "0.11"

# Text
parley    = "0.2"

# Layout
taffy     = "0.5"

# JS Runtime
v8        = { package = "rusty_v8", version = "0.32" }

# Async
tokio     = { version = "1", features = ["rt-multi-thread", "fs", "sync", "time"] }

# Utils
log       = "0.4"
env_logger = "0.11"
thiserror = "1"
anyhow    = "1"
pollster  = "0.3"
bytemuck  = { version = "1", features = ["derive"] }
smallvec  = "1"
image     = { version = "0.25", default-features = true }
notify    = "6.1"

[profile.dev]
opt-level = 1          # faster compiles, decent perf in dev

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
