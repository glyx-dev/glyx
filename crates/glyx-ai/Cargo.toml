[package]
name    = "glyx-ai"
version = "0.2.0"
edition = "2021"

[dependencies]
candle-core         = { workspace = true }
candle-nn           = { workspace = true }
candle-transformers = { workspace = true }
hf-hub              = { workspace = true }
tokenizers          = { workspace = true }
anyhow              = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
log                 = { workspace = true }
sha2                = { workspace = true }
parking_lot         = { workspace = true }
# Decoders for ai.transcribe's MP3, FLAC and OGG input (WAV is read by our own parser and needs none of this).
symphonia           = { version = "0.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg"], optional = true }

[features]
default = ["compressed-audio"]
# MP3, FLAC and OGG input for transcription. Off: WAV only. The decoders are the ones glyx-cap-audio already links.
compressed-audio = ["dep:symphonia"]
# Future: cuda  = ["candle-core/cuda",  "candle-nn/cuda",  "candle-transformers/cuda"]
# Future: metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dev-dependencies]
sysinfo = { workspace = true }
