[package]
name        = "glyx-bundler"
version     = "0.2.0"
edition     = "2021"
description = "Bundles a Glyx app's JavaScript/TypeScript with esbuild (or Bun) and runs its TypeScript config"

[features]
# Fetching a pinned esbuild when none is installed. The CLI turns this on; the
# runner library doesn't need it (the CLI has already cached esbuild by the
# time the runner rebuilds anything) and stays small without it.
default  = ["download"]
download = ["dep:ureq", "dep:flate2", "dep:tar", "dep:sha2"]

[dependencies]
log        = { workspace = true }
serde_json = { workspace = true }
ureq       = { version = "2", optional = true }
flate2     = { workspace = true, optional = true }
tar        = { workspace = true, optional = true }
sha2       = { workspace = true, optional = true }
