[package]
name    = "glyx-cap-audio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glyx-cap-abi = { path = "../glyx-cap-abi" }
rodio        = { version = "0.17", features = ["symphonia-all"] }
symphonia    = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "vorbis", "wav"] }
parking_lot  = "0.12"
log          = "0.4"
