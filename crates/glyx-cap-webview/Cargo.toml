[package]
name    = "glyx-cap-webview"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glyx-cap-abi = { path = "../glyx-cap-abi" }
wry          = { workspace = true }
raw-window-handle = { workspace = true }
parking_lot  = "0.12"
log          = "0.4"
serde        = { workspace = true }
serde_json   = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_Foundation"] }
