[package]
name    = "glyx-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "glyx"
path = "src/main.rs"

[dependencies]
clap       = { workspace = true }
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
env_logger = { workspace = true }
log        = { workspace = true }
crc32fast  = { workspace = true }
image      = { workspace = true }
ico        = { workspace = true }
zip        = { workspace = true }
flate2     = { workspace = true }
tar        = { workspace = true }
sha2       = { workspace = true }
ureq       = "2"
time       = { version = "0.3", default-features = false, features = ["std"] }
# "signing" feature is a CLI-tooling-only escape hatch (never linked into the
# runtime) — powers `glyx caps sign`/`glyx caps keygen`. See
# glyx-verify/src/lib.rs's module doc for the trust-chain design.
glyx-verify   = { path = "../glyx-verify", features = ["signing"] }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand_core     = { version = "0.6", features = ["getrandom"] }
