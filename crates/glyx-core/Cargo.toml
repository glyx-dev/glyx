[package]
name    = "glyx-core"
version = "0.1.0"
edition = "2021"

[features]
# "dev" gates hot-reload: file watcher, bun subprocess, dev overlay.
# Production builds (glyx build --mode snapshot/bundle) disable this feature
# so notify and std::process::Command are never compiled in.
default = ["v8", "dev", "camera", "canvas3d", "audio", "gamepad", "hid", "ai", "fetch", "websocket", "updater"]
# JsRuntime backend selection — mutually exclusive, forwarded straight to
# glyx-runtime's own `v8`/`quickjs` features (see
# memory/quickjs-milestone0-progress.md). V8 is the desktop default (in
# `default` above); quickjs is opt-in via `default-features = false,
# features = ["quickjs", ...]`, same pattern the runner/CLI will use for a
# mobile or lightweight-desktop build.
v8       = ["glyx-runtime/v8"]
quickjs  = ["glyx-runtime/quickjs"]
dev      = ["notify", "glyx-runtime/dev", "ffmpeg-sidecar", "arboard"]
camera   = ["dep:nokhwa", "glyx-runtime/camera"]
canvas3d = ["dep:glyx-3d", "glyx-runtime/canvas3d"]
audio    = ["glyx-runtime/audio", "dep:rodio"]
gamepad  = ["glyx-runtime/gamepad"]
hid      = ["glyx-runtime/hid"]
ai       = ["glyx-runtime/ai"]
fetch    = ["glyx-runtime/fetch"]
websocket = ["glyx-runtime/websocket"]
updater  = ["glyx-runtime/updater"]
shell    = ["glyx-runtime/shell"]
webview  = ["glyx-runtime/webview", "dep:glyx-cap-abi"]
a11y     = ["glyx-shell/a11y", "glyx-runtime/a11y", "dep:accesskit"]

[dependencies]
glyx-gpu      = { path = "../glyx-gpu" }
glyx-security = { path = "../glyx-security" }
glyx-shell    = { path = "../glyx-shell" }
glyx-renderer = { path = "../glyx-renderer" }
glyx-text     = { path = "../glyx-text" }
glyx-layout   = { path = "../glyx-layout" }
glyx-runtime  = { path = "../glyx-runtime", default-features = false }
glyx-perf     = { path = "../glyx-perf" }
winit          = { workspace = true }
tokio          = { workspace = true }
pollster       = { workspace = true }
log            = { workspace = true }
parking_lot    = { workspace = true }
thiserror      = { workspace = true }
env_logger     = { workspace = true }
taffy          = { workspace = true }
image          = { workspace = true }
resvg          = "0.44"
notify          = { workspace = true, optional = true }
arboard         = { workspace = true, optional = true }
ffmpeg-sidecar  = { workspace = true, optional = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
dotenvy        = { workspace = true }
sysinfo        = { workspace = true }
lru            = { workspace = true }
smallvec       = { workspace = true }
glyx-3d        = { path = "../glyx-3d", optional = true }
glyx-cap-abi   = { path = "../glyx-cap-abi", optional = true }
accesskit      = { workspace = true, optional = true }
raw-window-handle = { workspace = true }
nokhwa         = { workspace = true, optional = true }
glyx-media    = { path = "../glyx-media" }
rodio          = { workspace = true, optional = true }
mimalloc       = { workspace = true }
base64         = { workspace = true }
# Software present path for the TinySkia backend — replaces the entire
# wgpu device/swapchain layer for CPU-rendered apps (~40-60 MB RSS).
softbuffer     = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }
# Direct2D present target (experimental `renderMode: 'direct2d'` backend, see
# d2d_present.rs). Uses the higher-level `windows` crate (COM wrapper methods)
# rather than windows-sys here specifically: the DXGI-swapchain/ID2D1DeviceContext
# object graph this backend needs is COM-interface-heavy enough that raw-FFI
# vtable calls would be significantly more error-prone, and this exact API
# surface was already proven working in a standalone spike before this
# dependency was added.
windows = { version = "0.58", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
