[package]
name    = "glyx-core"
version = "0.1.0"
edition = "2021"

[features]
# "dev" gates hot-reload: file watcher, bun subprocess, dev overlay.
# Production builds (glyx build --mode snapshot/bundle) disable this feature
# so notify and std::process::Command are never compiled in.
default = ["dev", "camera", "canvas3d", "audio", "gamepad", "hid", "ai", "fetch", "websocket", "updater"]
dev      = ["notify", "glyx-runtime/dev", "ffmpeg-sidecar", "arboard"]
camera   = ["dep:nokhwa", "glyx-runtime/camera"]
canvas3d = ["dep:glyx-3d", "glyx-runtime/canvas3d"]
audio    = ["glyx-runtime/audio", "dep:rodio"]
gamepad  = ["glyx-runtime/gamepad"]
hid      = ["glyx-runtime/hid"]
ai       = ["glyx-runtime/ai"]
fetch    = ["glyx-runtime/fetch"]
websocket = ["glyx-runtime/websocket"]
updater  = ["glyx-runtime/updater"]
webview  = ["glyx-runtime/webview", "dep:glyx-cap-abi", "dep:raw-window-handle"]
a11y     = ["glyx-shell/a11y", "glyx-runtime/a11y", "dep:accesskit"]

[dependencies]
glyx-gpu      = { path = "../glyx-gpu" }
glyx-security = { path = "../glyx-security" }
glyx-shell    = { path = "../glyx-shell" }
glyx-renderer = { path = "../glyx-renderer" }
glyx-text     = { path = "../glyx-text" }
glyx-layout   = { path = "../glyx-layout" }
glyx-runtime  = { path = "../glyx-runtime", default-features = false, features = ["v8"] }
glyx-perf     = { path = "../glyx-perf" }
winit          = { workspace = true }
tokio          = { workspace = true }
pollster       = { workspace = true }
log            = { workspace = true }
parking_lot    = { workspace = true }
thiserror      = { workspace = true }
env_logger     = { workspace = true }
taffy          = { workspace = true }
image          = { workspace = true }
resvg          = "0.44"
notify          = { workspace = true, optional = true }
arboard         = { workspace = true, optional = true }
ffmpeg-sidecar  = { workspace = true, optional = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
dotenvy        = { workspace = true }
sysinfo        = { workspace = true }
lru            = { workspace = true }
smallvec       = { workspace = true }
glyx-3d        = { path = "../glyx-3d", optional = true }
glyx-cap-abi   = { path = "../glyx-cap-abi", optional = true }
accesskit      = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
nokhwa         = { workspace = true, optional = true }
glyx-media    = { path = "../glyx-media" }
rodio          = { workspace = true, optional = true }
mimalloc       = { workspace = true }
base64         = { workspace = true }
# Software present path for the TinySkia backend — replaces the entire
# wgpu device/swapchain layer for CPU-rendered apps (~40-60 MB RSS).
softbuffer     = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }
