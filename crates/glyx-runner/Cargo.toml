[package]
name    = "glyx-runner"
version = "0.1.0"
edition = "2021"
description = "Prebuilt runtime binary for Glyx apps (no Rust toolchain required by app developers)"

[features]
# "dev" gates hot-reload watcher, bun subprocess, and dev overlay in glyx-core.
# `glyx dev`   → runs runner with default (dev) features.
# `glyx build` → builds runner with --no-default-features for a lean prod binary.
default = ["dev"]
dev     = ["glyx-core/dev"]

[dependencies]
glyx-core  = { path = "../glyx-core", default-features = false }
glyx-shell = { path = "../glyx-shell" }
env_logger  = { workspace = true }
crc32fast   = { workspace = true }
