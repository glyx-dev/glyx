[package]
name    = "glyx-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
v8             = { workspace = true }
mimalloc       = { workspace = true }
tokio          = { workspace = true }
log            = { workspace = true }
parking_lot    = { workspace = true }
thiserror      = { workspace = true }
anyhow         = { workspace = true }
glyx-security = { path = "../glyx-security" }
glyx-db       = { path = "../glyx-db" }
serde_json     = { workspace = true }
rfd                 = { workspace = true }
arboard             = { workspace = true }
clipboard-win       = { workspace = true }
notify-rust         = { workspace = true }
raw-window-handle   = { workspace = true }
reqwest             = { workspace = true, optional = true }
base64              = { workspace = true }
tokio-tungstenite   = { workspace = true, optional = true }
futures-util        = { workspace = true, optional = true }
mdns-sd             = { workspace = true }
glyx-perf          = { path = "../glyx-perf" }
glyx-sysapi        = { path = "../glyx-sysapi" }
glyx-text          = { path = "../glyx-text" }
battery             = { workspace = true }
sysinfo             = { workspace = true }
keepawake           = { workspace = true }
gilrs               = { workspace = true, optional = true }
global-hotkey       = { workspace = true }
rodio               = { workspace = true, optional = true }
symphonia           = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "vorbis", "wav"], optional = true }
hidapi              = { workspace = true, optional = true }
self_update         = { workspace = true, optional = true }
ed25519-dalek       = { workspace = true, optional = true }
glyx-media         = { path = "../glyx-media" }
serde               = { workspace = true }
glyx-3d            = { path = "../glyx-3d", optional = true }
glyx-ai            = { path = "../glyx-ai", optional = true }
glyx-cap-abi       = { path = "../glyx-cap-abi" }
glyx-cap-audio     = { path = "../glyx-cap-audio", optional = true }
glyx-cap-ai        = { path = "../glyx-cap-ai", optional = true }
glyx-cap-gamepad   = { path = "../glyx-cap-gamepad", optional = true }
glyx-cap-hid       = { path = "../glyx-cap-hid", optional = true }
glyx-cap-camera    = { path = "../glyx-cap-camera", optional = true }
glyx-macros        = { path = "../glyx-macros" }
glyx-verify        = { path = "../glyx-verify" }
libloading         = { workspace = true }
hex                = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader"] }
notify             = { workspace = true }

[features]
default = ["v8", "embed-icu"]
v8 = []       # V8 backend (current only backend; rusty_v8 dep is always required for now)
# Use a custom V8 build from the glyx-v8 repo instead of rusty_v8's prebuilt.
# When enabled, mimalloc is already merged into the V8 archive, so the
# force-link hack in lib.rs is disabled. You must also point the `v8` crate at
# the glyx-v8 artifact (see .cargo/config.toml `[env]` example / CI). Flip off to
# return to the default prebuilt + force-link behaviour.
glyx-v8 = []
# Embed the full icudtl.dat (ICU 77) into the binary. ON for tests/dev and any
# build that wants a zero-external-file binary. App builds go through glyx-core
# with `default-features = false`, so this is OFF there — packaged apps instead
# ship a trimmed icudtl.dat next to the executable (see glyx-icu-integration.md).
embed-icu = []
dev = ["websocket"]      # dev overlay, hot-reload, CDP inspector (needs WS transport)
full     = ["audio", "gamepad", "canvas3d", "ai", "hid", "updater", "fetch", "websocket"]
fetch     = ["dep:reqwest"]
websocket = ["dep:tokio-tungstenite", "dep:futures-util"]
audio    = ["dep:rodio", "dep:glyx-cap-audio", "dep:symphonia"]
gamepad  = ["dep:gilrs", "dep:glyx-cap-gamepad"]
canvas3d = ["dep:glyx-3d"]
ai       = ["dep:glyx-ai", "dep:glyx-cap-ai"]
hid      = ["dep:hidapi", "dep:glyx-cap-hid"]
camera   = ["dep:glyx-cap-camera"]
updater  = ["dep:self_update", "dep:ed25519-dalek"]
# jsc = []    # future: JavaScriptCore (iOS/macOS)
# quickjs = [] # future: QuickJS (embedded/WASM)
