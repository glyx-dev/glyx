[package]
name    = "velox-core"
version = "0.1.0"
edition = "2021"

[features]
# "dev" gates hot-reload: file watcher, bun subprocess, dev overlay.
# Production builds (velox build --mode snapshot/bundle) disable this feature
# so notify and std::process::Command are never compiled in.
default = ["dev"]
dev = ["notify"]

[dependencies]
velox-gpu      = { path = "../velox-gpu" }
velox-security = { path = "../velox-security" }
velox-shell    = { path = "../velox-shell" }
velox-renderer = { path = "../velox-renderer" }
velox-text     = { path = "../velox-text" }
velox-layout   = { path = "../velox-layout" }
velox-runtime  = { path = "../velox-runtime" }
velox-perf     = { path = "../velox-perf" }
winit          = { workspace = true }
tokio          = { workspace = true }
pollster       = { workspace = true }
log            = { workspace = true }
thiserror      = { workspace = true }
env_logger     = { workspace = true }
taffy          = { workspace = true }
image          = { workspace = true }
notify         = { workspace = true, optional = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
dotenvy        = { workspace = true }
sysinfo        = { workspace = true }
lru            = { workspace = true }
smallvec       = { workspace = true }
velox-3d       = { path = "../velox-3d" }
