[package]
name    = "a11y-ime-demo"
version = "0.1.0"
edition = "2021"

[features]
# "dev" gates hot-reload, bun watcher, and dev overlay in glyx-core.
# Production builds (glyx build) use --no-default-features to exclude them.
default = ["dev"]
dev     = ["glyx-core/dev"]

[dependencies]
# a11y: this example's whole purpose is exercising IME + the accessibility tree.
glyx-core  = { path = "../../crates/glyx-core", default-features = false, features = ["a11y"] }
glyx-shell = { path = "../../crates/glyx-shell" }
env_logger  = "0.11"
