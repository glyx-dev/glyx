[package]
name    = "notes-app"
version = "0.1.0"
edition = "2021"

[features]
# "dev" gates hot-reload watcher, bun subprocess, dev overlay in velox-core.
# Production builds (velox build) disable this feature via --no-default-features.
default = ["dev"]
dev     = ["velox-core/dev"]

[dependencies]
velox-core  = { path = "../../crates/velox-core", default-features = false }
velox-shell = { path = "../../crates/velox-shell" }
env_logger  = { workspace = true }
